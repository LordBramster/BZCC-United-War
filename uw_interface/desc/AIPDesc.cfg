// ================
// BATTLEZONE SHELL
// ================

//
// CREATE THE NAME DIALOG
//

CreateControl("AIPDescPage", "WINDOW")
{	
	// inherit root window's dimensions
	Geometry("PARENTWIDTH", "PARENTHEIGHT");

	ColorGroup("BACKGROUND");

	Style("MODAL");

	CreateControl("BigWindow", "WINDOW")
	{

		Geometry("RIGHT", "TOP");
		ColorGroup("MAGENTA");
		Position(-20, 60);
		Size(270, 300);
		BorderSize(10);
		BevelSize(5);
		TabSize(125, 10);
		Style("OUTLINE", "INERT");
		Title("AIPs Info");
		TitleFont("SMALL");
		ForceOpaqueBackground();

		CreateControl("CloseAIPDesc", "BUTTON")
		{
			ColorGroup("BLACKBLUE");
			Geometry("LEFT", "TOP");
			Position(75, 290);
			Size(100, 10);
			BorderSize(3);
			BevelSize(3);
			Style("ROLLOVER");
			Cursor("Highlight");
			Font("SMALL");
			Text("Close");
			NotifyParent("Button::Press","CloseAIPDesc");
		}
		
		
		CreateControl("AIPDescription", "LISTBOX")
		{
			Geom("HCENTRE", "VCENTRE");
			ColorGroup("LISTBOX");
			Pos(0, -10);
			Size(270, 264);
			CellSize(255, 11);
			BorderSize(5);
			BevelSize(3);
			SliderPadding(5);
			Font("TINY");
			Style("INERT", "NOSELECTION", "VSLIDER");
			ItemConfig()
			{
				Style("TRANSPARENT");
			}
			FillFromFile("AIPDesc.txt");
		}	

		OnEvent("CloseAIPDesc")
		{
			FadeOut("|AIPDescPage");
		}
	}
}
