// ================================
// BATTLEZONE EDITOR INITIALIZATION
// ================================

//
// CONFIGURE CURSORS
//
ConfigureCursors()
{
	// DEFAULT CURSOR
	CreateCursor("Default")
	{
		Size(32, 32);
		Hotspot(5, 10);
		Image("cursorHD.tga");
		Frames(0, 63);
		FrameRate(60);
  	}

	// HIGHLIGHT CURSOR
	CreateCursor("Highlight")
  	{
	    	Size(32, 32);
    		Hotspot(5, 10);
    		Image("cursorHD.tga");
		Frames(0, 63);
		FrameRate(60);
  	}

	// SET STANDARD CURSORS
  	StandardCursors()
	{
		Default("Default");
		IBeam("Default");
		Wait("Default");
		No("Default");
	}
}
