// ===================================
// BATTLEZONE SATELLITE TERMINAL DISPLAY
// ===================================

//
// CREATE SATELLITE TERMINAL DISPLAY
//
CreateControl("SatellitePanel", "WINDOW")
{
	// inherit root window's dimensions
	Geometry("PARENTWIDTH", "PARENTHEIGHT");

	// set window style
	Style("TRANSPARENT", "INERT");


	// TODO
	// GBD
	CreateControl("SatellitePanelBG", "WINDOW")
	{
		ColorGroup("WHITE");
		Geom("PARENTWIDTH", "PARENTHEIGHT");
		Style("INERT", "TRANSPARENT");
		Image("EscapeBackStarField.tga", 0, 0, 3840, 2160); //BackStarField.tga
	}

	//
	// create the nav name edit box
	//
	CreateControl("NavEdit", "STATIC")
	{
		Geometry("BOTTOM", "HCENTRE");
		Position(240, -100); //20, -20
		Size(150, 10);
		BorderSize(10);
		BevelSize(5);
		Style("OUTLINE");
		TabSize(100, 10);
		Title("Edit Nav");									// SIRBRAMBLEY
		TitleFont("MEDIUM");
		Cursor("Highlight");

		CreateControl("Edit", "EDIT")
		{
			ColorGroup("LISTBOX");
			Position(0, 0);
			Size(150, 10);
			BorderSize(5);
			BevelSize(3);
			Style("ROLLOVER");
			Font("LARGE");
			UseVar("control.satellite.name");
		}
	}

	//
	// SATELLITE CONTROL TIP "CENTERING"
	//
	CreateControl("SatControlTip1", "STATIC")
	{
		ColorGroup("MAGENTA");
		Geometry("BOTTOM", "HCENTRE");	
		Position(240, -80);
		Size(260, 0);
		Style("ROLLOVER", "OUTLINE", "INERT");
		Font("TINY");
		Text("PRESS [CTRL+C] TO CENTER VIEW ON SHIP");
		// TODO SHOW CONTROL INPUT STRING
		// Justify("LEFT");
		// Text("PRESS [%S] TO CENTER ON SHIP"); // ONLY SHOWS FIRST CHAR
		// UseVar("inputbind.center_player.value1");
	}
	CreateControl("SatControlTip2", "STATIC")
	{
		ColorGroup("MAGENTA");
		Geometry("BOTTOM", "HCENTRE");	
		Position(240, -60);
		Size(260, 0);
		Style("ROLLOVER", "OUTLINE", "INERT");
		Font("TINY");
		Text("PRESS [CTRL+R] TO CENTER VIEW ON BASE");
		// TODO SHOW CONTROL INPUT STRING
		// Justify("LEFT");
		// Text("PRESS [%S] TO CENTER ON SHIP"); // ONLY SHOWS FIRST CHAR
		// UseVar("inputbind.center_player.value1");
	}

	//
	// SATELLITE CONTROL TIP "LOGOUT"
	//
	CreateControl("LogoutText", "STATIC")
	{
		ColorGroup("WARNINGRED"); //MAGENTA
		Geometry("BOTTOM", "HCENTRE");	
		Position(240, -40);
		Size(200, 0); // (139, 0)
		Style("ROLLOVER", "OUTLINE", "INERT");
		Font("TINY");
		Text("PRESS [6] TO EXIT SATELLITE VIEW");
	}

	//
	// SATELLITE LOGOUT BUTTON
	//
	CreateControl("SatControlTip2", "BUTTON")
	{
		ColorGroup("WARNINGRED"); //MAGENTA
		// Geometry("BOTTOM", "RIGHT");
		// Position(-20, -20);
		Geometry("BOTTOM", "HCENTRE");
		Position(240, -20);
		Size(150, 0); // (139, 0)
		BorderSize(10);
		BevelSize(1);
		// BevelSize(5);
		// TabSize(100, 10);
		// TitleFont("MEDIUM");
		// Title("Logout");
		Style("ROLLOVER", "OUTLINE", "BLINK");
		Font("SMALL");
		Text("EXIT SATELLITE VIEW");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Logout");
		Sound("ButtonPress", "abetty15.wav");
	}

	OnEvent("Logout")
	{
		Cmd("control.satellite.exit");
	}
}