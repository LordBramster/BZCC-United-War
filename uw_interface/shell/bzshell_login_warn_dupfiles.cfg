// =================================
// BATTLEZONE EDITOR CAMERA CONTROLS
// =================================

//
// CREATE THE LICENSE WINDOW
//
CreateControl("WarningDupfiles", "STATIC")
{
	ColorGroup("BACKGROUND");
	Geom("PARENTWIDTH", "PARENTHEIGHT");
	Style("MODAL");

	CreateControl("Window", "STATIC")
	{
		// ColorGroup("LISTBOX"); 				// ADDED
		ColorGroup("WARNINGRED");
		Geom("HCENTRE", "VCENTRE");
		Pos(0, 5);
		Size(400, 150);
		Style("MODAL", "TABROOT", "OUTLINE");
		BorderSize(10);
		BevelSize(5);
		TabSize(200, 10);
		TitleFont("MEDIUM");
		Title("Duplicate Files"); //"Warning: Duplicate files"
		ForceOpaqueBackground();

		CreateControl("IconWarning", "STATIC")
		{
			ColorGroup("WARNINGRED");
			Geom("HCENTRE", "TOP");
			Pos(0, -64);
			Size(32, 32);
			Text("");
			Font("TINY");
			JustifyText("CENTER");
			Image("icon_menu_warn.tga");
		}

		//
		// create the text display
		//
		CreateControl("Text", "LISTBOX")
		{
			// ColorGroup("BACKGROUND");
			Geom("HCENTRE", "TOP"); 					//ADDED
			ColorGroup("WARNINGRED");
			Pos(0, 10); // (0, 80)
			Size(400, 110);
			CellSize(394, 11);
			BorderSize(5);
			BevelSize(3);
			SliderPadding(5);
			Font("TINY"); //SMALL
			Style("INERT", "NOSELECTION", "VSLIDER", "TRANSPARENT");
			ItemConfig()
			{
				Style("TRANSPARENT");
			}
			//			FillFromFile("bzshell_multi_warn_player.txt");
		}

		//
		// create the ok button
		//
		CreateControl("OK", "BUTTON")
		{
			// ColorGroup("LISTBOX");
			ColorGroup("WARNINGRED");
			Geom("HCENTRE", "BOTTOM");
			Pos(5, -5);
			Size(50, 10);
			BorderSize(5);
			BevelSize(3);
			Font("MEDIUM");
			Text("OK");
			Style("ROLLOVER");
			NotifyParent("Button::Press", "OK");
		}

		// handle the ok event
		OnEvent("OK")
		{
			FadeOut("|WarningDupfiles");
		}
	}
}
