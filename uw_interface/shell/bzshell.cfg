		SetModelRotation(1.15);
	}

	OnEvent("Control::ActivateSelf")
	{
		cmd("shell.showversion");
		// cmd("shell.background main.tga BackStarField.tga"); // STOCK
		cmd("shell.background main.tga CLR0x000000"); // GBD's suggestion
		cmd("shell.movie");
		Activate("|ShellMain");
		cmd("shell.backgroundSound mire22_2.wav");
	}
	
	OnEvent("Control::DeactivateSelf")
	{
		cmd("shell.stopSound mire22_2.wav");
	}

	OnEvent("Single")
	{
		FadeOut("|ShellMain");
		FadeIn("|ShellSingle");
		Cmd("shell.single.enter");
	}

	OnEvent("PostPreMovie")
	{
		Deactivate("|ShellMain");
		Activate("|ShellSingle");
	}
	
	OnEvent("Instant")
	{
		FadeOut("|ShellMain");
		FadeIn("|ShellInstant");
	}
	
	OnEvent("InstantOps")
	{
		FadeOut("|ShellMain");
		FadeIn("|ShellInstantOps");
	}

	OnEvent("Multi")
	{
		//FadeOut("|ShellMain");
		Cmd("shell.multi.enter");
		//FadeIn("|ShellMulti");
	}

	OnEvent("Load")
	{
		FadeOut("|ShellMain");
		FadeIn("|ShellLoad");
	}

	OnEvent("Options")
	{
		FadeOut("|ShellMain");
		FadeIn("|OptionPanel");
	}

	OnEvent("Mods")
	{
		FadeOut("|ShellMain");
		FadeIn("|ShellPreMods");
	}

	OnEvent("Logout")
	{
		FadeOut("|ShellMain");
		FadeIn("|ShellLogin");	
	}
	
	OnEvent("Achievements")
	{
		cmd("shell.viewachievements");
	}

	OnEvent("Stats")
	{
		FadeOut("|ShellMain");		
		FadeIn("|ShellStats");
	}

	OnEvent("Quit")
	{
		Cmd("sys.runcode quit");
	}

