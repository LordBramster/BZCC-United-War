	}

	CreateControl("Continue", "BUTTON")
	{
		Geom("RIGHT");
		ColorGroup("MAGENTA");
		Position(-20, 20);
		Size(139, 0);
		BorderSize(10);
		BevelSize(1);
		//BorderSize(10);
		//BevelSize(5);
		Style("ROLLOVER", "OUTLINE", "BLINK");
		Text("Continue");
		Font("MEDIUM");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Next");
	}

	CreateControl("Main", "BUTTON")
	{
		ColorGroup("MAGENTA");
		Position(20, 20);
		Size(139, 0);
		BorderSize(10);
		BevelSize(1);
		//BorderSize(10);
		//BevelSize(5);
		Style("ROLLOVER", "RADIO", "OUTLINE");
		Text("Main");
		Font("MEDIUM");
		Cursor("DARK");
		NotifyParent("Button::Select", "Back");
		UseVar("shell.page");
		Value(-1);
	}

	OnEvent("Next")
	{
		FadeOut();
		FadeIn("|ShellSingle");
		cmd("shell.stopSound mire22_6.wav");
		Cmd("shell.single.enter");
	}

	OnEvent("Back")
	{
		cmd("shell.stopSound mire22_6.wav");
		FadeOut();
		FadeIn("|ShellMain");
	}

	CreateControl("ShellMultiEnd", "WINDOW")
	{
		Geometry("HCENTRE", "VCENTRE");
		ColorGroup("MAGENTA");
		Position(0, 15);
		Size(600, 250);
		BorderSize(10);
		BevelSize(1);
		//BorderSize(10);
		//BevelSize(5);
		TabSize(150, 10);
		Title("Game Results");
		TitleFont("MEDIUM");
		Style("OUTLINE");

		CreateControl("SelectionSlider", "LISTSLIDER")
		{
			Orientation("VERTICAL");
			Geometry("LEFT", "TOP");
			Position(580, 40);
			Size(10, 210);
			Style("BUTTONS", "ROLLOVER");
			Cursor("Highlight");
			// Do NOT use a var for this slider!
			// It's controlled automagically by association
		}

		CreateControl("ScoreColumn1", "LISTBOX")
		{
			ColorGroup("LISTBOX");	
			Geometry("LEFT", "TOP");
			Position(50, 40);
			Size(400, 210);
			CellSize(390, 15);
			Font("Small");
			UseVar("network.scoredisplay");
			Style("NOSELECTION", "TRANSPARENT");
			ItemConfig()
			{
				Style("TRANSPARENT");
			}
			UseSlider("<SelectionSlider");
		}

		CreateControl("ScoreColumn2", "LISTBOX")
		{
			ColorGroup("LISTBOX");	
			Geometry("LEFT", "TOP");
			Position(450, 40);
			Size(70, 210);
			CellSize(60, 15);
			Font("Small");
			UseVar("network.scoredisplay");
			Style("NOSELECTION", "TRANSPARENT");
			ItemConfig()
  			{
  				Style("TRANSPARENT");
  			}
			UseSlider("<SelectionSlider");
		}
	}
}


