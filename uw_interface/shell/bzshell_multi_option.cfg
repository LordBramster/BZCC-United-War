		NotifyParent("Button::Press", "Launch");
	}

	OnEvent("Launch")
	{
		cmd("shell.stopSound mire22_4.wav");
		Cmd("shell.multi.launch");
		Cmd("network.launch");
	}

	// handle the launch event
	OnEvent("Leave")
	{
		Cmd("network.session.leave");
