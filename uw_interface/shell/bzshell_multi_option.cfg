	//
	// create the "launch" button
	//
	CreateControl("Launch", "TopMenuButton") // "MainMenuButton")
	{
		Geom("RIGHT", "TOP");
		ColorGroup("HULLGAUGE");			// WARNINGRED
		Position(-20, 20);
		Style("ROLLOVER", "OUTLINE", "BLINK");
		Text("Launch"); //"Start Game"
