// call generic setup
ConfigureInterface()
{
	CreateFontRedux("TINY", "BHR"); //6,10,14,18,22,26,30,34,38
	CreateFontRedux("MEDIUM", "OBR"); //10,15,20,25,30,35,40,45,50

	// CreateFontRedux("SYSTEM", "bgmm");

	DefineColorGroup("LOADBAR")
	{
		// ORANGE
		Foreground(0, 208, 124, 62, 200);			// 1, 1, 1, 250
		Background(0, 10, 10, 10, 125);
		Gradient(0, 10, 10, 10, 125);
	}

	DefineColorGroup("LOADBARTEXT")
	{
		// WHITE: unselected, unhighlit
		Foreground(0, 255, 255, 255, 255);
		Background(0, 0, 0, 0, 255);
		Gradient(0, 0, 0, 0, 255);
	}

	DefineColorGroup("LOADBARTEXT2")
	{
		// ORANGE: unselected, unhighlit
		Foreground(0, 255, 174, 8, 255);
		Background(0, 10, 10, 10, 120);
		Gradient(0, 0, 0, 0, 120);

		// // CYAN: unselected, unhighlit
		// Foreground(0, 50, 255, 255, 225);
		// Background(0, 50, 222, 233, 100);
		// Gradient(0, 50, 193, 233, 75);
	}
	
}

