CreateControl("InstantOpsPopup", "WINDOW")
{	
	Geometry("PARENTWIDTH", "PARENTHEIGHT");
	ColorGroup("WARNINGRED"); //BACKGROUND

	CreateControl("MissionWindow", "WINDOW")
	{
		Geometry("RIGHT", "VCENTER"); //HCENTER
		ColorGroup("MAGENTA"); //COMMANDTEXTINFOBOX
		Position(0, 0);
		Size(270, 350);
		BorderSize(10);
		BevelSize(5);
		TabSize(125, 10);
		Style("OUTLINE", "INERT");
		Title("BRIEF");
		TitleFont("MEDIUM");
		// ForceOpaqueBackground();

		CreateControl("MissionBriefing", "LISTBOX")
		{
			Geom("HCENTRE", "TOP");
			ColorGroup("COMMANDTEXTKEYS"); //LISTBOX
			Pos(0, 10);
			Size(270, 200);
			CellSize(268, 11);
			Font("TINY");
			Style("INERT", "NOSELECTION", "VSLIDER", "TRANSPARENT");
			FillFromFile("uw_ops_01.des");
			ItemConfig()
			{
				Style("TRANSPARENT");
			}
		}

        CreateControl("MissionTag", "STATIC")
		{
			Geom("HCENTRE", "TOP");
			ColorGroup("WARNINGRED");
			Pos(0, 250);
			Size(270, 10);
			Font("TINY");
			Style("INERT", "TRANSPARENT");
			Text("ENVIRONMENTAL HAZARDS");
		}


		//
		// DIFFICULTY TITLE
		//
		CreateControl("Difficulty", "STATIC")
		{
			// ColorGroup("MAGENTA");
			ColorGroup("DEFAULT");
			Geometry("HCENTRE", "VCENTRE");
			Position(0, 0);
			Size(100, 10);
			Style("TRANSPARENT");
			Font("SMALL");
			JustifyText("CENTER");
			Text("DIFFICULTY");		// SIRBRAMBLEY
		}

		//
		// create easy difficulty button
		//
		CreateControl("Easy", "DifficultyRadioButton") // OptionRadioButton // OptionButton
		{
			ColorGroup("GAMEOPTIONICONS");
			Align("<Difficulty");
			Position(0, 16);
			Text("");
			Font("TINY"); // SIRBRAMBLEY
			Image("icon_menu_skill_e.tga", 0, 0, 128, 128);
			UseVar("shell.instant.difficulty");
			Value(0);
		}

		//
		// create the medium difficulty button
		//
		CreateControl("Medium", "DifficultyRadioButton") // OptionRadioButton // OptionButton
		{
			ColorGroup("GAMEOPTIONICONS");
			Align("<Easy");
			// Text("Medium");
			Text("");
			Font("TINY"); // SIRBRAMBLEY
			Image("icon_menu_skill_m.tga", 0, 0, 128, 128);
			UseVar("shell.instant.difficulty");
			Value(1);
		}

		//
		// create the hard difficulty button
		//
		CreateControl("Hard", "DifficultyRadioButton") // OptionRadioButton // OptionButton
		{
			ColorGroup("GAMEOPTIONICONS");
			Align("<Medium");
			// Text("Hard");
			Text("");
			Font("TINY"); // SIRBRAMBLEY
			Image("icon_menu_skill_h.tga", 0, 0, 128, 128);
			UseVar("shell.instant.difficulty");
			Value(2);
		}

        CreateControl("LaunchGame", "StatsButton")
		{
			ColorGroup("MAGENTA");
			Geometry("HCENTER", "TOP");
			Position(0, 300);
            Size(150, 10);
            BorderSize(5);
            BevelSize(0);							// BevelSize(3);
            Style("ROLLOVER", "OUTLINE");
            Font("MEDIUM");
            Image("ButtonN.tga", 0, 0, 860, 131);
            Text("Begin");
            Cursor("Highlight");
			NotifyParent("Button::Press", "Launch");
		}

		CreateControl("ClosePopup", "BackMenuButton")
		{
			Geometry("HCENTER", "TOP");
			Position(0, 340);
            Text("Close");
			NotifyParent("Button::Press", "ClosePopup");
		}

		OnEvent("ClosePopup")
		{
			FadeOut("|InstantOpsPopup");
		}

		OnEvent("Launch")
		{
			Cmd("shell.instant.launch");
		}
	}
}