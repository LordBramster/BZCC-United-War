// ================
// BATTLEZONE SHELL
// ================

//
// CREATE THE CHAT WINDOW
//
CreateControl("Communications", "WINDOW")
{
	Style( "INERT", "OUTLINE", "TRANSPARENT");
	Geometry("LEFT", "BOTTOM");
	ColorGroup("MAGENTA");
	Position(20, -20);
	Size(400, 230);
	BorderSize(10);
	BevelSize(5);
	TabSize(160, 10);
	Title("Communications");
	TitleFont("SMALL");

	//
	// create the chat line list
	//
	CreateControl("ChatList", "LISTBOX")
	{
		ColorGroup("LISTBOX");
		Geometry("LEFT", "TOP");
		Position(0, 0);
		Size(400, 200);
		CellSize(394, 12); //385, 12
		BorderSize(5);
		BevelSize(3);
		SliderPadding(5);
		Style("NOSELECTION", "AUTOSCROLL", "VSLIDER");
		Font("TINY");
		ItemConfig()
		{
			Style("TRANSPARENT");
		}
		UseVar("shell.multi.chatlist");
	}

	CreateControl("ChatLineIdentifier", "STATIC")
	{
		Geometry("LEFT", "BOTTOM");
		ColorGroup("COMMANDTEXTKEYS");			//SIRBRAMBLEY
		JustifyText("LEFT");
		Position(0, 0);
		Size(45, 10);
		Font("TINY"); //SMALL
		Text("Chat >>"); //"Say:"
		Style("TRANSPARENT");
	}

	CreateControl("SessionNameDisplay", "STATIC")
	{
		Geometry("LEFT", "TOP");
		ColorGroup("COMMANDTEXTKEYS");			//SIRBRAMBLEY
		JustifyText("LEFT");
		Position(0, -30);
		Size(350, 10);
		Font("TINY");
		Text("%S");
		UseVar("network.session.namebox");
		Style("TRANSPARENT");
	}

	CreateControl("SessionMsgDisplay", "STATIC")
	{
		Geometry("LEFT", "TOP");
		ColorGroup("COMMANDTEXTKEYS");			//SIRBRAMBLEY
		JustifyText("LEFT");
		Position(0, -20);
		Size(350, 10);
		Font("TINY");
		Text("%S");
		UseVar("network.session.servermsg");
		Style("TRANSPARENT");
	}

	//
	// create the chat edit box
	//
	CreateControl("ChatEdit", "EDIT")
	{
		Style( "ROLLOVER", "OUTLINE"); //, "TRANSPARENT"
		Geometry("LEFT", "BOTTOM");
		ColorGroup("LISTBOX");
		Position(50, 0);
		Size(350, 10);
		BorderSize(3);	//5
		BevelSize(1);	//3
		Font("TINY");
		UseVar("network.chateditline");
		Cursor("Highlight");
		MaxLength(250);	
		NotifyParent("Edit::Enter", "ChatEnter");
	}

	//
	// User hit enter in chatline. Notify game,
	//
	OnEvent("ChatEnter")
	{
		Cmd("network.chatline.entered");
	}
}

