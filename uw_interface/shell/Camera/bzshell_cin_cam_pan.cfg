// ================
// BATTLEZONE SHELL
// ================

//
// CREATE SHELL GRAPHIC OPTIONS PAGE
//
CreateControl("CinCamPan", "WINDOW")
{
	Geometry("RIGHT", "BOTTOM");
	Position(-20, -20);
	Size(250, 260);
	BorderSize(10);
	BevelSize(5);
	TabSize(150, 10);
	Style("RIGHTTAB");
	Title("Pan");
	TitleFont("MEDIUM");

	//
	// create start direction title
	//
	CreateControl("sDirection", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 5);
		Size(100, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Start Dir.");
	}

	//
	// create x title
	//
	CreateControl("xStart", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 20);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("X");
	}

		//
	// create y title
	//
	CreateControl("yStart", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 35);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Y");
	}

	//
	// create the z title
	//
	CreateControl("zStart", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 50);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Z");
	}

	

	//
	// create set start Direction button
	//
	CreateControl("setStart", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 70);
		Size(85, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("Start Cam");
		Cursor("Highlight");
		NotifyParent("Button::Press", "setStart");
	}

	//
	// create end direction title
	//
	CreateControl("eDirection", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 90);
		Size(100, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("End Dir.");
	}

	//
	// create x title
	//
	CreateControl("xStart", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 105);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("X");
	}

		//
	// create y title
	//
	CreateControl("yStart", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 120);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Y");
	}

	//
	// create the z title
	//
	CreateControl("zStart", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 135);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Z");
	}

	
	//
	// create set end direction button
	//
	CreateControl("setEnd", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 155);
		Size(85, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("End Cam");
		Cursor("Highlight");
		NotifyParent("Button::Press", "setEnd");
	}
		//
	// start time title 
	//
	CreateControl("zEnd", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 175);
		Size(30, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Start Time");
	}
		//
	// end time title
	//
	CreateControl("zEnd", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(110, 175);
		Size(30, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("End Time");
	}


}
