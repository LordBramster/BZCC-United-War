// ================
// BATTLEZONE SHELL
// ================

//
// CREATE SHELL GRAPHIC OPTIONS PAGE
//
CreateControl("CinCamRotate", "WINDOW")
{
	Geometry("RIGHT", "BOTTOM");
	Position(-20, -20);
	Size(250, 260);
	BorderSize(10);
	BevelSize(5);
	TabSize(150, 10);
	Style("RIGHTTAB");
	Title("Rotate");
	TitleFont("MEDIUM");

	//
	// create attached object title
	//
	CreateControl("attachObject", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 5);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Attached Object:");
	}

	//
	// create set start position button
	//
	CreateControl("setEnd", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 50);
		Size(85, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("Pick Object");
		Cursor("Highlight");
		NotifyParent("Button::Press", "setEnd");
	}

	//
	// create start position title
	//
	CreateControl("camOffset", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 70);
		Size(100, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Camera Offsets:");
	}

	//
	// create x title
	//
	CreateControl("xOffset", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 85);
		Size(15, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("X");
	}

	//
	// create y title
	//
	CreateControl("yOffset", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 100);
		Size(15, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Y");
	}

	//
	// create the z title
	//
	CreateControl("zOffset", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 115);
		Size(15, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Z");
	}
	
	
	CreateControl("viewObject", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 135);
		Size(1, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Viewed Object:");
	}

	//
	// create set start position button
	//
	CreateControl("setEnd", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 175);
		Size(85, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("Pick Object");
		Cursor("Highlight");
		NotifyParent("Button::Press", "setEnd");
	}	


	//
	// set number of rotations 
	//
	CreateControl("numRotations", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 195);
		Size(60, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Number of Rotations:");
	}
	

	//
	// start time title 
	//
	CreateControl("sTime", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(5, 230);
		Size(30, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Start Time");
	}
		//
	// end time title
	//
	CreateControl("eTime", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(110, 230);
		Size(30, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("End Time");
	}


}
