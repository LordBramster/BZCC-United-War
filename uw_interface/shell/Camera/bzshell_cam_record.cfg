// ================
// BATTLEZONE SHELL
// ================

//
// CREATE SHELL GRAPHIC OPTIONS PAGE
//
CreateControl("RecordManager", "WINDOW")
{
	Geometry("RIGHT", "TOP");
	Position(-20, 30);
	Size(250, 50);
	BorderSize(10);
	BevelSize(5);
	TabSize(150, 10);
	Style("RIGHTTAB");
	Title("Camera Recording");
	TitleFont("MEDIUM");
	
//
	// create the new camera move entry box
	//
	CreateControl("NewMove", "EDIT")
	{
		Geometry("LEFT", "TOP");
		Position(5, 10);
		Size(240, 10);
		Style("ROLLOVER");
		BorderSize(10);
		BevelSize(5);
		Font("SMALL");
		UseVar("script.record.name");
		Cursor("Highlight");
	}
	
	//
	// create the back button
	//
	CreateControl("Back", "BUTTON")
	{
		Geometry("LEFT", "BOTTOM");
		Position(5, 10);
		Size(50, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("Back");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Back");
	}

	//
	// create the load cineractive button
	//
	CreateControl("Stop", "BUTTON")
	{
		Geometry("LEFT", "BOTTOM");
		Position(75, 10);
		Size(50, 10);
		BorderSize(5);
		BevelSize(3);
		Font("SMALL");
		JustifyText("CENTER");
		Text("Stop");
		Style("ROLLOVER");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Stop");
	}

	//
	// create the "Record" button
	//
	CreateControl("Record", "BUTTON")
	{
		Geometry("LEFT", "BOTTOM");
		Position(140, 10);
		Size(50, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("Record");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Start");
	}

	//
	// create the "Play" button
	//
	CreateControl("Play", "BUTTON")
	{
		Geometry("RIGHT", "BOTTOM");
		Position(5, 10);
		Size(50, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("Play");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Play");
	}
	
	//
	// handle the back event
	//
	OnEvent("Back") {
		Deactivate();
	}

	//
	// handle the "create set" event
	//
	OnEvent("Start") {
		Cmd("script.start.record");
	}

	//
	// handle the "Load set" event
	//
	OnEvent("Stop")
	{
		Cmd("script.stop.record");
	}

	//
	// handle the "Play" event
	//
	OnEvent("Play")
	{
		Cmd("script.play.record");
	}
	
	
}
