// ================
// BATTLEZONE SHELL
// ================

Exec("bzshell_cin_cam_dolly.cfg");
Exec("bzshell_cin_cam_pan.cfg");
Exec("bzshell_cin_cam_chase.cfg");
Exec("bzshell_cin_cam_rotate.cfg");

//
// CREATE Camera move options
//
CreateControl("CineractiveCamera", "WINDOW")
{
	Geometry("RIGHT", "TOP");
	Position(-20, 30);
	Size(250, 120);
	BorderSize(10);
	BevelSize(5);
	TabSize(150, 10);
	Style("RIGHTTAB");
	Title("Camera Actions");
	TitleFont("MEDIUM");

	//
	// create the Camera Moves title
	//
	CreateControl("CameraMoves", "STATIC")
	{
		Geometry("LEFT", "TOP");
		Position(0, 0);
		Size(100, 10);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("LEFT");
		Text("Camera Moves");
	}

	//
	// create camera dolly
	//
	CreateControl("Dolly", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 20);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("Dolly");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Dolly");
	}

	//
	// create camera pan
	//

	CreateControl("Pan", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(85, 20);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("Pan");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Pan");
	}

	//
	// create camera rotate
	//
	CreateControl("Rotate", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(165, 20);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("Rotate");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Rotate");
	}

	//
	// create chase cam
	//
	CreateControl("ChaseCam", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 45);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("Chase");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Chase");
	}

	//
	// create back button
	//
	CreateControl("Back", "BUTTON")
	{
		Geometry("LEFT", "BOTTOM");
		Position(5, -5);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		Text("BACK");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Back");
	}
	//clean everything up if we leave the cinseractive section

	OnEvent("Control::DeactivateSelf")
	{
		Deactivate("|CinCamPan");
		Deactivate("|CinCamChaseCam");
		Deactivate("|CinCamRotate");
		Deactivate("|CinCamDolly");
	}

	//
	// give the dolly options
	// 
	OnEvent("Dolly")
	{
		Deactivate("|CinCamPan");
		Deactivate("|CinCamChaseCam");
		Deactivate("|CinCamRotate");

		Activate("|CinCamDolly");
	}

	//
	// give the Pan options
	// 
	OnEvent("Pan")
	{
		Deactivate("|CinCamDolly");
		Deactivate("|CinCamChaseCam");
		Deactivate("|CinCamRotate");

		Activate("|CinCamPan");
	}
	//
	// give the dolly options
	// 
	OnEvent("Chase")
	{
		Deactivate("|CinCamPan");
		Deactivate("|CinCamDolly");
		Deactivate("|CinCamRotate");

		Activate("|CinCamChaseCam");
	}
	//
	// give the dolly options
	// 
	OnEvent("Rotate")
	{
		Deactivate("|CinCamPan");
		Deactivate("|CinCamChaseCam");
		Deactivate("|CinCamDolly");

		Activate("|CinCamRotate");
	}

	//
	// go back to the load camera move screen
	// 
	OnEvent("Back")
	{
		Deactivate();
		Deactivate("|CinCamPan");
		Deactivate("|CinCamChaseCam");
		Deactivate("|CinCamDolly");
		Deactivate("|CinCamRotate");
		Activate("|cam_move");
	}


}
