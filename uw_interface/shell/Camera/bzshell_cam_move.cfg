// ================
// BATTLEZONE SHELL
// ================

Exec("bzshell_init.cfg");
//Exec("bzshell_cin_cam_dolly.cfg");

//
// CREATE SHELL GRAPHIC OPTIONS PAGE
//
CreateControl("MoveManager", "WINDOW")
{
	Geometry("RIGHT", "TOP");
	Position(-20, 30);
	Size(250, 225);
	BorderSize(10);
	BevelSize(5);
	TabSize(150, 10);
	Style("RIGHTTAB");
	Title("Camera Moves");
	TitleFont("MEDIUM");

	//
	// create the game list box
	//
	CreateControl("MoveList", "WINDOW")
	{
		Geometry("LEFT", "TOP");
		Position(5, 5);
		Size(240, 100);
		BorderSize(10);
		BevelSize(5);
	
		CreateControl("List", "LISTBOX")
		{
			ColorGroup("LISTBOX");

			Position(0, 0);
			Size(240, 99);
			CellSize(240, 11);
			BorderSize(5);
			BevelSize(3);
			Font("SMALL");
			NotifyParent("Listbox::DblClick", "LoadMove");
			UseVar("script.cinfiles.name");
			Cursor("Highlight");
		}
	}

	//
	// create the new camera move entry box
	//
	CreateControl("NewMove", "EDIT")
	{
		Geometry("LEFT", "TOP");
		Position(5, 130);
		Size(240, 10);
		Style("ROLLOVER");
		BorderSize(10);
		BevelSize(5);
		Font("SMALL");
		UseVar("script.newcin.name");
		Cursor("Highlight");
	}
	
	//
	// create the back button
	//
	CreateControl("Back", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 160);
		Size(50, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("Back");
		Cursor("Highlight");
		NotifyParent("Button::Press", "Back");
	}

	//
	// create the load cineractive button
	//
	CreateControl("LoadCin", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(80, 160);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Font("SMALL");
		JustifyText("CENTER");
		Text("Load Set");
		Style("ROLLOVER");
		Cursor("Highlight");
		NotifyParent("Button::Press", "LoadSet");
	}

	//
	// create the "Create" button
	//
	CreateControl("Create", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(170, 160);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("New Set");
		Cursor("Highlight");
		NotifyParent("Button::Press", "NewSet");
	}
	
	//
	// create the "Add Move" button
	//
	CreateControl("addMove", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(5, 190);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("+ Move");
		Cursor("Highlight");
		NotifyParent("Button::Press", "AddMove");
	}

	//
	// create the "Load Move" button
	//
	CreateControl("loadMove", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(85, 190);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("Ld Move");
		Cursor("Highlight");
		NotifyParent("Button::Press", "LoadMove");
	}

	//
	// create the "Load Sequence" button
	//
	CreateControl("loadSequence", "BUTTON")
	{
		Geometry("LEFT", "TOP");
		Position(170, 190);
		Size(65, 10);
		BorderSize(5);
		BevelSize(3);
		Style("ROLLOVER");
		Font("SMALL");
		JustifyText("CENTER");
		Text("Sequen.");
		Cursor("Highlight");
		NotifyParent("Button::Press", "LoadSequencer");
	}
	

	//
	// handle the back event
	//
	OnEvent("Back") {
		Deactivate();
	}

	//
	// handle the "create set" event
	//
	OnEvent("NewSet") {
		Cmd("script.create.cinfile");
		//Deactivate();
	}

	
	//
	// handle the "Load set" event
	//
	OnEvent("LoadSet")
	{
		Cmd("script.load.cinfile");
		//Deactivate();

	}
	
	OnEvent("LoadMove") {
		Cmd("script.load.move");
		//Deactivate();
	}

	OnEvent("AddMove") {
		Cmd("script.add.move");
		//Deactivate();
	}
	
	OnEvent("LoadSequencer") {
		Cmd("script.load.sequencer");

	}
}
