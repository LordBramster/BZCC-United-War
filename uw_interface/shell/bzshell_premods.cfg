
CreateControl("ShellPreMods", "WINDOW")
{
	Geometry("PARENTWIDTH", "PARENTHEIGHT");
	Style("TRANSPARENT");

	// REPLACED
	CreateControl("Main", "BackMenuButton")
	{
		Geometry("LEFT", "BOTTOM"); //TOP
		Position(40, -20);
		Text("Main Menu");
		NotifyParent("Button::Press", "Main");
	}

	// REPLACED
	CreateControl("GetMods", "StatsButton")
	{
		Geometry("LEFT", "BOTTOM"); //TOP
		Position(40, -50);
		Font("MEDIUM");
		Text("Workshop");
		NotifyParent("Button::Press", "GetMods");
	}

	//
	// MOD PAGE TITLE
	//
	CreateControl("ModsTitle", "STATIC")
	{
		ColorGroup("COMMANDTEXTKEYS");
		Geometry("HCENTER", "VCENTER");
		Position(0, -100);
		Size(260, 121);
		Style("TRANSPARENT");
		Font("MEDIUM");
		JustifyText("CENTER");
		Text("Mod Activation");
	}

	//
	// MOD PAGE INFO
	//
	CreateControl("ModsInfo", "LISTBOX")
	{
		Geometry("RIGHT", "BOTTOM");
		ColorGroup("LISTBOX");
		Position(0, -5);
		Size(220, 165);
		CellSize(210, 11);
		BorderSize(5);
		// BevelSize(3);
		BevelSize(0);
		Style("VSLIDER", "TRANSPARENT");
		Font("SMALL");
		Cursor("Highlight");
		FillFromFile("uw_menu_mods_01.des");
	}

	CreateControl("ConfigMods", "BUTTON")
	{
		ColorGroup("MAGENTA");
		Geometry("LEFT", "TOP");
		Position(200, 200);
		Size(130, 0);
		// Size(200, 100);
		BorderSize(10);
		BevelSize(0);
		// BevelSize(5);
		Style("ROLLOVER", "OUTLINE");
		Text("Config Mods");						// SIRBRAMBLEY
		Font("MEDIUM");
		Cursor("Highlight");
		NotifyParent("Button::Press", "ConfigMods");
	}
	
	CreateControl("AddonMods", "BUTTON")
	{
		ColorGroup("MAGENTA");
		Geometry("LEFT", "TOP");
		Position(453, 200);
		Size(130, 0);
		// Size(200, 100);
		BorderSize(10);
		BevelSize(0);
		// BevelSize(5);
		Style("ROLLOVER", "OUTLINE");
		Text("Addon Mods");							// SIRBRAMBLEY
		Font("MEDIUM");
		Cursor("Highlight");
		NotifyParent("Button::Press", "AddonMods");
	}

	OnEvent("Main")
	{
		FadeOut();
		FadeIn("|ShellMain");
	}
	
	OnEvent("ConfigMods")
	{
		FadeOut();
		FadeIn("|ShellMods");
	}
	
	OnEvent("AddonMods")
	{
		FadeOut();
		FadeIn("|ShellAddons");
	}
	
	OnEvent("GetMods")
	{
		Cmd("shell.configmod.getconfigmods");
	}

	OnEvent("Control::ActivateSelf")
	{
		cmd("shell.backgroundSound mire22_5.wav");					// KEEPING MAIN MENU MUSIC CONTINUOUS ACROSS PAGE
		cmd("shell.background shell_premods.tga");
	}
	
	OnEvent("Control::Activate")
	{
		cmd("shell.configmod.testWorkshopButtons");
	}
}

