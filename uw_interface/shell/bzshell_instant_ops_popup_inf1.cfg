CreateControl("InstantOpsPlanetPopup1", "WINDOW")
{	
	Geometry("PARENTWIDTH", "PARENTHEIGHT");
	ColorGroup("WARNINGRED"); //BACKGROUND

	CreateControl("PlanetInfoWindow", "WINDOW")
	{
		Geometry("RIGHT", "VCENTER"); //HCENTER
		ColorGroup("MAGENTA"); //COMMANDTEXTINFOBOX
		Position(0, 0);
		Size(270, 350);
		BorderSize(10);
		BevelSize(0);
		TabSize(125, 10);
		Style("OUTLINE", "INERT");
		Title("LUNO (Earth's Moon)");
		TitleFont("TINY");
		// ForceOpaqueBackground();

		CreateControl("PlanetSpecs", "LISTBOX")
		{
			Geom("HCENTRE", "TOP");
			ColorGroup("COMMANDTEXTKEYS"); //LISTBOX
			Pos(0, 10);
			Size(270, 200);
			CellSize(268, 11);
			Font("TINY");
			Style("INERT", "NOSELECTION", "VSLIDER", "TRANSPARENT");
			FillFromFile("uw_planet_01.des");
			ItemConfig()
			{
				Style("TRANSPARENT");
			}
		}

        CreateControl("PlanetTag", "STATIC")
		{
			Geom("HCENTRE", "TOP");
			ColorGroup("WARNINGRED");
			Pos(0, 250);
			Size(270, 10);
			Font("TINY");
			Style("INERT", "TRANSPARENT");
			Text("ENVIRONMENTAL HAZARDS");
		}

		CreateControl("ClosePopup", "BackMenuButton")
		{
			Geometry("HCENTER", "TOP");
			Position(0, 340);
            Text("Close");
			NotifyParent("Button::Press", "ClosePopup");
		}

		OnEvent("ClosePopup")
		{
			cmd("shell.stopSound uw_narr_moon0.wav");
			FadeOut("|InstantOpsPlanetPopup1");
		}
	}
}