	OnEvent("NextPage")
	{
		FadeOut("Settings");
		FadeOut("Resources");
		FadeOut("NextPageButton");

		FadeIn("PreviousPageButton");
		FadeIn("Hazards");
		FadeIn("OptionalObjectives");
		FadeIn("ShipChoice");
	}

	OnEvent("PrevPage")
	{
		FadeIn("Settings");
		FadeIn("Resources");
		FadeIn("NextPageButton");

		FadeOut("PreviousPageButton");
		FadeOut("Hazards");
		FadeOut("OptionalObjectives");
		FadeOut("ShipChoice");
	}

	OnEvent("BeginGame") 
	{
		cmd("script.menu.beginGame");
	}

	OnEvent("Control::ActivateSelf")
	{
		FadeOut("PreviousPageButton");
		FadeOut("Hazards");
		FadeOut("OptionalObjectives");
		FadeOut("ShipChoice");
	}
}