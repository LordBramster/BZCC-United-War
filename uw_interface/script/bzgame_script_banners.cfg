CreateControl("BannerObjectiveNewFade", "STATIC")
{
	OnEvent("Control::ActivateSelf")
	{
		FadeIn("|BannerObjectiveNew");
	}
	OnEvent("Control::DeactivateSelf")
	{
		FadeOut("|BannerObjectiveNew");
	}
}

CreateControl("BannerObjectiveNew", "STATIC")
{
	Geom("HCENTRE", "VCENTER");
	Pos(0, -125); // 0, -250
	Size(286, 44); //357, 55 <= 286, 44 <= 216, 32
    ColorGroup("OBJECTIVECYAN");
    Image("objectivebar0.tga");
}

